[project]
name = "py-video-stabilizer"
version = "0.1.0"
description = "Stabilize shaky video by smoothing the camera path locally, with an absolute roll lock and an expanding canvas that never crops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "opencv-python>=4.9"]

[project.scripts]
stabilize = "stabilize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["stabilize.py"]
sources = ["."]
