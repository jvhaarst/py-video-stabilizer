name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        run: |
          uv venv
          uv pip install -e .

      - name: stabilize.py must still produce the committed fixture
        run: .venv/bin/python tests/check_fixture.py

      - name: The browser port must match stabilize.py
        run: node tests/conformance.mjs
